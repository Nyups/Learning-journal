<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--<script src="script.js" defer></script> -->
    <script src="Storage_exercise.js" defer></script>
</head>
<body>
    <!-- Task board -->
    <header>
    <h1>Task Board Maker</h1>

    </header>

    <form action="">
    <fieldset>
        <legend>Task Maker V1</legend>
        <label for="task_maker">Task :</label>
        <input type="text" id="task_maker" name="task" placeholder="Today I want..."/>
        <button id="adding" type="button">Add</button>

        <div id="container">
        <ul id="task"></ul>
        </div>
    </fieldset>
    </form>

    <br>
    <form id="task_form">
        <input id="task_input" type="text" placeholder="Your task here..." />

        <select name="" id="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <select name="" id="category">
            <option value="work">Work</option>
            <option value="study">Study</option>
            <option value="personal">Personal</option>
        </select>

        <input type="date" name="" id="due_date"/>


        <button id="task_submit" type="submit">Add Task</button>
    </form>
<br>
    <div id="task_container">

    </div>
<br>
    <div id="completed_task_container">
        <h2>Completed task :</h2>

    </div>

<h3>///////////////////////////////////////////////////////////////</h3>



    <!-- Local storage test -->
     <!-- Greeting from storage -->
    <div id="storage">
    <h2>Local storage app test :</h2>
    <br>
    <h3>What's your name ?</h3>
    <input id="user_input" type="text" placeholder="your name here..."/>
    <button type="button" id="save">Save</button>
    <button type="button" id="greeting">Greet Me</button>
    </div>



    <!-- Character card creator -->
     <div id="character_input">
     <h2>Character cards maker</h2>
     <h3>name</h3>
     <input type="text" name="name" id="name_input" placeholder="your character name is..." />
     <select name="race" id="race_selection">
        <option value="Drone">Drone</option>
        <option value="Human">Human</option>
        <option value="Other">Other</option>
     </select>
     <h3>Lore</h3>
     <textarea id="character_lore" rows="5" cols="40" placeholder="Your story here..."></textarea>
     <button type="button" id="character_save">Submit</button>
     <button type="button" id="test_load">test load</button>
     </div>

     <div id="character_card"></div>
</body>
<style>
    body {
        background-color: black;
        color: white;
    }

</style>
</html>
