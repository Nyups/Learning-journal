<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Course Review</h1>

    <section id="semantic">
        <fieldset>
            <legend class="title">Semantic HTML</legend>
            <h4>What I liked :</h4>
            <textarea name="semantic-comments" id="semantic-comments" cols="40" rows="5"></textarea>

            <h4>General Rating</h4>
            <select name="semantic-rating" id="semantic-rating">
                <option value=""> ☆ ☆ ☆ ☆  ★</option>
                <option value=""> ☆ ☆ ☆ ★ ★</option>
                <option value="" selected> ☆ ☆  ★ ★ ★</option>
                <option value=""> ☆ ★ ★ ★ ★</option>
                <option value=""> ★ ★ ★ ★ ★</option>
            </select>
        </fieldset>
    </section>

    <section id="text-html"">
        <fieldset>
            <legend class="title">Text HTML</legend>
            <h4>What I liked</h4>
            <textarea name="text-comments" id="text-comments" cols="40" rows="5"></textarea>

            <h4>General Rating</h4>
            <select name="text-rating" id="text-rating">
                <option value=""> ☆ ☆ ☆ ☆  ★</option>
                <option value=""> ☆ ☆ ☆ ★ ★</option>
                <option value="" selected> ☆ ☆  ★ ★ ★</option>
                <option value=""> ☆ ★ ★ ★ ★</option>
                <option value=""> ★ ★ ★ ★ ★</option>
            </select>
        </fieldset>
    </section>

    <section id="form">
        <fieldset>
            <legend>Form in HTML</legend>
            <h4>What I liked</h4>
            <textarea name="form-comment" id="form-comment" cols="40" rows="5"></textarea>

            <h4>General Rating</h4>
            <select name="form-rating" id="form-rating">
                <option value=""> ☆ ☆ ☆ ☆  ★</option>
                <option value=""> ☆ ☆ ☆ ★ ★</option>
                <option value="" selected> ☆ ☆  ★ ★ ★</option>
                <option value=""> ☆ ★ ★ ★ ★</option>
                <option value=""> ★ ★ ★ ★ ★</option>
            </select>
        </fieldset>
    </section>
</body>
<style>
    body {
        background-color: black;
        color: red;
    }

    .title {
        font-weight: bold;
    }

    textarea {
        background-color: black;
        color: white;
    }

    option {
        background-color: black;
        color: white;
    }
</style>
</html>
