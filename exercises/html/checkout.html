<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Checkout</h1>

    <section>
        <h2>your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="">
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name"><span aria-hidden="true">Name</span></label>
            <input type="text" id="card-name" name="card-name" required/>
            

            <label for="card-number"><span aria-hidden="true">Number</span></label>
            <input type="number" id="card-number" name="card-number" required/>
            <p id="card-number" aria-describedby="card-number">Use the original card number format</p>
            
        </form>
    </section>
</body>
</html>
