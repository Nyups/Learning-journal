        <p>『もののけ姫』（もののけひめ、英語: Princess Mononoke） <br>
            は、1997年7月12日に公開されたスタジオジブリ制作の日本のアニメーション映画。原作・脚本・監督は宮崎駿。<br>
            興行収入は214億6000万円で、当時『E.T.』（1982年）を抜いて、日本歴代興行収入第1位を記録した。キャッチコピーは「生きろ。」<br><br>
            20世紀の日本映画（邦画）興行収入第1位。</p>
